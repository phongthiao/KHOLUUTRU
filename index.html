<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ Thống Quản Lý 3 Kho OneDrive 15GB</title>
  <script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; margin: 20px; background: #f0f2f5; color: #333; }
    .container { max-width: 1100px; margin: 0 auto; }
    .accounts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 15px; margin-bottom: 20px; }
    .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .progress-bar { height: 12px; background: #e0e0e0; border-radius: 6px; overflow: hidden; margin: 10px 0; }
    .progress-fill { height: 100%; background: #0078d4; width: 0%; transition: width 0.3s; }
    .btn { background: #0078d4; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 500; margin-right: 5px; }
    .btn:hover { background: #005a9e; }
    .btn-success { background: #107c41; }
    .btn-danger { background: #d13438; }
    input[type="text"], input[type="file"] { padding: 8px; margin: 5px 0; border: 1px solid #ccc; border-radius: 6px; width: 100%; box-sizing: border-box; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; background: white; border-radius: 8px; overflow: hidden; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
    th { background: #f8f9fa; }
    .status-text { font-size: 0.9em; color: #0078d4; font-weight: bold; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <h2>📁 Quản Lý 3 Kho OneDrive Cá Nhân (15GB Tổng)</h2>
    
    <div class="accounts-grid" id="accountsList"></div>

    <div class="card">
      <h3 id="currentKhoTitle">🔍 Đang chọn: Chưa mở kho nào</h3>
      <input type="text" id="searchInput" placeholder="Tìm kiếm tệp trong kho..." oninput="filterFiles()">
      
      <div style="margin-top: 15px;">
        <label><b>Tải tệp lên kho đang mở (Tự động hỗ trợ file lớn > 4MB):</b></label>
        <input type="file" id="fileUploader" multiple>
        <button class="btn btn-success" id="btnUpload" onclick="uploadFiles()">🚀 Tải Lên</button>
        <button class="btn" id="btnDownloadBatch" onclick="downloadSelectedBatch()">📦 Tải Hàng Loạt (.ZIP)</button>
      </div>
      <div id="statusMessage" class="status-text"></div>
    </div>

    <table id="fileTable">
      <thead>
        <tr>
          <th width="40"><input type="checkbox" id="selectAll" onclick="toggleSelectAll(this)"></th>
          <th>Tên Tệp / Thư Mục</th>
          <th>Dung Lượng</th>
          <th>Thao Tác</th>
        </tr>
      </thead>
      <tbody id="fileListBody">
        <tr><td colspan="4" style="text-align: center;">Vui lòng bấm nút "+ Kết Nối Hotmail" hoặc "📂 Mở Kho Này" ở trên.</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    // Dùng Client ID Public chính thức của Microsoft Graph
    const CLIENT_ID = "de8bc8b5-d9f9-48b1-a8ad-0738d72e7ad6";

    const msalConfig = {
      auth: {
        clientId: CLIENT_ID,
        authority: "https://login.microsoftonline.com/common"
      },
      cache: { cacheLocation: "localStorage" }
    };

    const msalApp = new msal.PublicClientApplication(msalConfig);
    const SCOPES = ["User.Read", "Files.ReadWrite.All"];
    let currentAccountIndex = null;
    let currentFiles = [];

    async function init() {
      await msalApp.initialize();
      const accounts = msalApp.getAllAccounts();
      renderAccounts(accounts);
    }

    async function loginAccount() {
      try {
        await msalApp.loginPopup({ scopes: SCOPES });
        init();
      } catch (err) {
        console.error("Đăng nhập thất bại:", err);
      }
    }

    async function getAccessToken(account) {
      try {
        const res = await msalApp.acquireTokenSilent({ account, scopes: SCOPES });
        return res.accessToken;
      } catch {
        const res = await msalApp.acquireTokenPopup({ account, scopes: SCOPES });
        return res.accessToken;
      }
    }

    async function renderAccounts(accounts) {
      const container = document.getElementById("accountsList");
      container.innerHTML = "";

      for (let i = 0; i < 3; i++) {
        const acc = accounts[i];
        const card = document.createElement("div");
        card.className = "card";

        if (acc) {
          const token = await getAccessToken(acc);
          const driveInfo = await fetchDriveQuota(token);
          const usedGB = (driveInfo.used / (1024 ** 3)).toFixed(2);
          const totalGB = (driveInfo.total / (1024 ** 3)).toFixed(2);
          const percent = ((driveInfo.used / driveInfo.total) * 100).toFixed(1);

          card.innerHTML = `
            <h4>Kho ${i + 1}: ${acc.username}</h4>
            <p>Đã dùng: <b>${usedGB} GB</b> / ${totalGB} GB (${percent}%)</p>
            <div class="progress-bar"><div class="progress-fill" style="width: ${percent}%"></div></div>
            <button class="btn" onclick="loadFiles(${i})">📂 Mở Kho Này</button>
            <button class="btn btn-danger" onclick="logoutAccount(${i})">Thoát Kho</button>
          `;
        } else {
          card.innerHTML = `
            <h4>Kho ${i + 1}: (Chưa liên kết)</h4>
            <p>Liên kết tài khoản Hotmail ${i + 1}</p>
            <button class="btn" onclick="loginAccount()">+ Kết Nối Hotmail</button>
          `;
        }
        container.appendChild(card);
      }
    }

    async function fetchDriveQuota(token) {
      try {
        const res = await fetch("https://graph.microsoft.com/v1.0/me/drive", {
          headers: { Authorization: `Bearer ${token}` }
        });
        const data = await res.json();
        return data.quota || { used: 0, total: 5368709120 };
      } catch {
        return { used: 0, total: 5368709120 };
      }
    }

    async function loadFiles(accIndex) {
      currentAccountIndex = accIndex;
      const account = msalApp.getAllAccounts()[accIndex];
      document.getElementById("currentKhoTitle").innerText = `🔍 Đang chọn: Kho ${accIndex + 1} (${account.username})`;
      
      const token = await getAccessToken(account);
      const res = await fetch("https://graph.microsoft.com/v1.0/me/drive/root/children", {
        headers: { Authorization: `Bearer ${token}` }
      });
      const data = await res.json();
      currentFiles = data.value || [];
      renderFileList(currentFiles);
    }

    function renderFileList(files) {
      const tbody = document.getElementById("fileListBody");
      tbody.innerHTML = "";

      if (files.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align: center;">Kho này hiện tại chưa có tệp nào.</td></tr>';
        return;
      }

      files.forEach((file, index) => {
        const sizeMB = (file.size / (1024 * 1024)).toFixed(2);
        const downloadUrl = file["@microsoft.graph.downloadUrl"];

        tbody.innerHTML += `
          <tr>
            <td><input type="checkbox" class="file-select" data-index="${index}"></td>
            <td>${file.folder ? "📁" : "📄"} <b>${file.name}</b></td>
            <td>${file.folder ? "-" : sizeMB + " MB"}</td>
            <td>
              ${file.file ? `<a href="${downloadUrl}" target="_blank" class="btn">Tải Về</a>` : ""}
            </td>
          </tr>
        `;
      });
    }

    async function uploadFiles() {
      if (currentAccountIndex === null) return alert("Vui lòng mở 1 kho trước khi tải tệp lên!");
      const fileInput = document.getElementById("fileUploader");
      if (!fileInput.files.length) return alert("Vui lòng chọn ít nhất 1 tệp!");

      const account = msalApp.getAllAccounts()[currentAccountIndex];
      const token = await getAccessToken(account);
      const status = document.getElementById("statusMessage");

      for (let file of fileInput.files) {
        status.innerText = `⏳ Đang tải lên: ${file.name}...`;
        if (file.size < 4 * 1024 * 1024) {
          await fetch(`https://graph.microsoft.com/v1.0/me/drive/root:/${file.name}:/content`, {
            method: "PUT",
            headers: { Authorization: `Bearer ${token}`, "Content-Type": file.type },
            body: file
          });
        } else {
          const sessionRes = await fetch(`https://graph.microsoft.com/v1.0/me/drive/root:/${file.name}:/createUploadSession`, {
            method: "POST",
            headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" }
          });
          const sessionData = await sessionRes.json();
          const uploadUrl = sessionData.uploadUrl;

          const chunkSize = 320 * 1024 * 10;
          let start = 0;
          while (start < file.size) {
            const end = Math.min(start + chunkSize, file.size);
            const chunk = file.slice(start, end);
            await fetch(uploadUrl, {
              method: "PUT",
              headers: { "Content-Range": `bytes ${start}-${end - 1}/${file.size}` },
              body: chunk
            });
            start = end;
            status.innerText = `⏳ Đang tải lên ${file.name}: ${((start/file.size)*100).toFixed(0)}%`;
          }
        }
      }
      status.innerText = "✅ Tải lên thành công tất cả tệp!";
      fileInput.value = "";
      loadFiles(currentAccountIndex);
      init();
    }

    async function downloadSelectedBatch() {
      const checkboxes = document.querySelectorAll(".file-select:checked");
      if (checkboxes.length === 0) return alert("Vui lòng tích chọn ít nhất 1 tệp!");

      const zip = new JSZip();
      const status = document.getElementById("statusMessage");
      status.innerText = "⏳ Đang chuẩn bị các tệp...";

      for (let cb of checkboxes) {
        const fileData = currentFiles[cb.getAttribute("data-index")];
        if (fileData.file) {
          const downloadUrl = fileData["@microsoft.graph.downloadUrl"];
          const blob = await fetch(downloadUrl).then(r => r.blob());
          zip.file(fileData.name, blob);
        }
      }

      status.innerText = "⏳ Đang nén file ZIP...";
      const content = await zip.generateAsync({ type: "blob" });
      saveAs(content, `OneDrive_Kho_${currentAccountIndex + 1}_Files.zip`);
      status.innerText = "✅ Đã tải file ZIP thành công!";
    }

    function toggleSelectAll(masterKey) {
      document.querySelectorAll(".file-select").forEach(cb => cb.checked = masterKey.checked);
    }

    function filterFiles() {
      const query = document.getElementById("searchInput").value.toLowerCase();
      const filtered = currentFiles.filter(f => f.name.toLowerCase().includes(query));
      renderFileList(filtered);
    }

    function logoutAccount(index) {
      const account = msalApp.getAllAccounts()[index];
      msalApp.logoutPopup({ account }).then(() => init());
    }

    init();
  </script>
</body>
</html>
