<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cửa Hàng Tài Nguyên - Tự Động</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col font-sans">

    <!-- Header / Navbar -->
    <header class="bg-gray-800 border-b border-gray-700 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-store text-indigo-500 text-2xl"></i>
                <span class="font-bold text-xl tracking-wide text-white">ResourceShop</span>
            </div>
            <!-- Wallet / Account Info -->
            <div class="flex items-center space-x-4 bg-gray-900 px-4 py-2 rounded-lg border border-gray-700">
                <i class="fa-solid fa-wallet text-emerald-400"></i>
                <div>
                    <div class="text-xs text-gray-400">Số dư hiện tại</div>
                    <div id="user-balance" class="font-bold text-emerald-400">Đang tải...</div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">
        
        <!-- Banner -->
        <div class="bg-gradient-to-r from-indigo-600 to-purple-600 rounded-2xl p-6 sm:p-8 mb-8 shadow-lg">
            <h1 class="text-2xl sm:text-3xl font-extrabold text-white mb-2">Hệ Thống Bán Tài Nguyên Tự Động</h1>
            <p class="text-indigo-100 text-sm sm:text-base">Giao dịch nhanh chóng, uy tín, hệ thống xử lý tức thì 24/7.</p>
        </div>

        <!-- Categories Filter -->
        <div class="mb-6">
            <h2 class="text-lg font-semibold mb-3 text-gray-300">Danh mục sản phẩm</h2>
            <div id="category-list" class="flex flex-wrap gap-2">
                <button onclick="filterCategory('all')" class="cat-btn active bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition">Tất cả</button>
                <!-- Dynamic Categories will be injected here -->
            </div>
        </div>

        <!-- Products Grid -->
        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Loading Skeleton -->
            <div class="bg-gray-800 p-5 rounded-xl border border-gray-700 animate-pulse h-64"></div>
            <div class="bg-gray-800 p-5 rounded-xl border border-gray-700 animate-pulse h-64"></div>
            <div class="bg-gray-800 p-5 rounded-xl border border-gray-700 animate-pulse h-64"></div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 border-t border-gray-700 py-6 text-center text-sm text-gray-400">
        &copy; 2026 ResourceShop. All rights reserved. Powered by API.
    </footer>

    <!-- JS Logic -->
    <script>
        // CONFIGURATION: Cấu hình API Key và Base URL
        const API_KEY = "tbk__l7iUqf6myzFxBN5-ToJ8gega0DXffrI-Aw098Uth2Y";
        const BASE_URL = "https://api.cuahangtainguyen.com/api/telebot/v1";

        let allProducts = [];

        // Headers chuẩn bị cho các lệnh API
        const headers = {
            "Authorization": `Bearer ${API_KEY}`,
            "Content-Type": "application/json",
            "Accept": "application/json"
        };

        // 1. Lấy thông tin tài khoản & Số dư
        async function fetchUserInfo() {
            try {
                const res = await fetch(`${BASE_URL}/me`, { headers });
                const data = await res.json();
                if (res.ok && data) {
                    const balance = data.balance || data.money || 0;
                    document.getElementById('user-balance').innerText = new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(balance);
                } else {
                    document.getElementById('user-balance').innerText = "Lỗi API Key";
                }
            } catch (err) {
                console.error("Lỗi kết nối User API:", err);
                document.getElementById('user-balance').innerText = "Không thể kết nối";
            }
        }

        // 2. Lấy danh mục sản phẩm (Categories)
        async function fetchCategories() {
            try {
                const res = await fetch(`${BASE_URL}/categories`, { headers });
                const categories = await res.json();
                const container = document.getElementById('category-list');

                if (Array.isArray(categories)) {
                    categories.forEach(cat => {
                        const btn = document.createElement('button');
                        btn.className = "cat-btn bg-gray-800 hover:bg-gray-700 text-gray-300 px-4 py-2 rounded-lg text-sm font-medium border border-gray-700 transition";
                        btn.innerText = cat.name || `Danh mục ${cat.id}`;
                        btn.onclick = () => filterCategory(cat.id, btn);
                        container.appendChild(btn);
                    });
                }
            } catch (err) {
                console.error("Lỗi lấy danh mục:", err);
            }
        }

        // 3. Lấy tất cả sản phẩm
        async function fetchProducts() {
            try {
                // Thử gọi lấy sản phẩm công khai
                const res = await fetch(`${BASE_URL}/categories/all/products`, { headers })
                    .catch(() => fetch(`${BASE_URL}/products`, { headers }));
                
                const data = await res.json();
                allProducts = Array.isArray(data) ? data : (data.data || []);
                renderProducts(allProducts);
            } catch (err) {
                console.error("Lỗi lấy sản phẩm:", err);
                document.getElementById('products-grid').innerHTML = `<div class="col-span-full text-center text-red-400 py-10">Không thể tải danh sách sản phẩm. Hãy kiểm tra lại API Key hoặc CORS.</div>`;
            }
        }

        // 4. Hiển thị danh sách sản phẩm ra màn hình
        function renderProducts(products) {
            const grid = document.getElementById('products-grid');
            grid.innerHTML = '';

            if (products.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center text-gray-400 py-10">Hiện chưa có sản phẩm nào trong mục này.</div>`;
                return;
            }

            products.forEach(p => {
                const priceFormatted = new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(p.price || 0);
                const card = document.createElement('div');
                card.className = "bg-gray-800 rounded-xl border border-gray-700 p-5 flex flex-col justify-between hover:border-indigo-500 transition shadow-sm hover:shadow-indigo-500/10";
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-2">
                            <h3 class="font-bold text-lg text-white line-clamp-1">${p.name || 'Sản phẩm ' + p.id}</h3>
                            <span class="bg-indigo-900/50 text-indigo-300 text-xs px-2.5 py-1 rounded-full border border-indigo-700/50">Kho: ${p.stock ?? 'Còn hàng'}</span>
                        </div>
                        <p class="text-gray-400 text-sm mb-4 line-clamp-2">${p.description || 'Không có mô tả chi tiết cho sản phẩm này.'}</p>
                    </div>
                    <div>
                        <div class="text-xl font-extrabold text-emerald-400 mb-4">${priceFormatted}</div>
                        <button onclick="buyProduct('${p.id}', '${p.name}')" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-lg transition flex items-center justify-center space-x-2">
                            <i class="fa-solid fa-cart-shopping"></i>
                            <span>Mua Ngay</span>
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // 5. Lọc sản phẩm theo danh mục
        function filterCategory(catId, element) {
            document.querySelectorAll('.cat-btn').forEach(b => {
                b.classList.remove('bg-indigo-600', 'text-white');
                b.classList.add('bg-gray-800', 'text-gray-300');
            });

            if (element) {
                element.classList.remove('bg-gray-800', 'text-gray-300');
                element.classList.add('bg-indigo-600', 'text-white');
            }

            if (catId === 'all') {
                renderProducts(allProducts);
            } else {
                const filtered = allProducts.filter(p => p.category_id == catId);
                renderProducts(filtered);
            }
        }

        // 6. Xử lý Mua Sản Phẩm (Gọi API POST /purchases)
        async function buyProduct(productId, productName) {
            if (!confirm(`Bạn có chắc chắn muốn mua: "${productName}"?`)) return;

            try {
                const res = await fetch(`${BASE_URL}/purchases`, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({
                        product_id: productId,
                        quantity: 1
                    })
                });

                const result = await res.json();

                if (res.ok) {
                    alert(`✅ Mua thành công! Mã đơn: ${result.id || 'Thành công'}\nNội dung/Tài khoản: ${result.code || result.data || 'Kiểm tra lịch sử mua'}`);
                    fetchUserInfo(); // Cập nhật lại số dư
                } else {
                    alert(`❌ Mua thất bại: ${result.message || 'Số dư không đủ hoặc hết hàng'}`);
                }
            } catch (err) {
                console.error("Lỗi khi mua hàng:", err);
                alert("❌ Đã xảy ra lỗi kết nối khi xử lý đơn hàng.");
            }
        }

        // Khởi chạy khi trang tải xong
        window.addEventListener('DOMContentLoaded', () => {
            fetchUserInfo();
            fetchCategories();
            fetchProducts();
        });
    </script>
</body>
</html>
