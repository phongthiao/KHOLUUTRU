<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Lý & Lưu Trữ Tài Liệu</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --danger: #dc2626;
            --danger-hover: #b91c1c;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 30px 15px; }
        .container { max-width: 1000px; margin: 0 auto; }
        
        header { text-align: center; margin-bottom: 25px; }
        header h1 { color: #1e293b; font-size: 1.8rem; font-weight: 700; margin-bottom: 6px; }
        header p { color: var(--text-muted); font-size: 0.95rem; }

        /* Dung lượng */
        .storage-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .storage-card { background: var(--card); padding: 18px; border-radius: 12px; border: 1px solid var(--border); box-shadow: var(--shadow); }
        .storage-title { font-size: 0.88rem; font-weight: 600; margin-bottom: 8px; display: flex; justify-content: space-between; }
        .progress-bg { width: 100%; background: #f1f5f9; height: 8px; border-radius: 99px; overflow: hidden; border: 1px solid #e2e8f0; }
        .progress-bar { width: 0%; background: var(--primary); height: 100%; border-radius: 99px; transition: width 0.5s ease; }

        /* Bố cục Form Upload & Xóa */
        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
        @media (max-width: 768px) { .action-grid { grid-template-columns: 1fr; } }

        .card-box { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); box-shadow: var(--shadow); }
        .card-box h3 { font-size: 1rem; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
        
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.82rem; font-weight: 600; margin-bottom: 5px; color: #475569; }
        input[type="file"], input[type="text"], select {
            width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.88rem; outline: none;
        }
        
        .btn {
            width: 100%; padding: 11px; border: none; border-radius: 6px; font-weight: 600; font-size: 0.9rem; cursor: pointer; color: white; transition: background 0.2s;
        }
        .btn-upload { background: var(--primary); }
        .btn-upload:hover { background: var(--primary-hover); }
        .btn-delete { background: var(--danger); }
        .btn-delete:hover { background: var(--danger-hover); }
        .btn:disabled { background: #94a3b8; cursor: not-allowed; }

        .status-msg { margin-top: 10px; font-size: 0.85rem; font-weight: 600; text-align: center; }

        /* Danh Sách Kho */
        .tabs { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab-btn {
            padding: 10px 20px; border: 1px solid var(--border); background: var(--card);
            border-radius: 8px; cursor: pointer; font-weight: 600; color: #64748b;
        }
        .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        .embed-container {
            background: var(--card); height: 500px; border-radius: 12px; overflow: hidden;
            box-shadow: var(--shadow); border: 1px solid var(--border);
        }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Kho Lưu Trữ Tài Liệu</h1>
            <p>Hệ thống quản lý, tải lên và xóa tài liệu tập trung</p>
        </header>

        <!-- THANH DUNG LƯỢNG -->
        <div class="storage-grid">
            <div class="storage-card">
                <div class="storage-title"><span>Kho Tài Liệu 1</span><span id="st-text-1">Đang kết nối...</span></div>
                <div class="progress-bg"><div id="st-bar-1" class="progress-bar"></div></div>
            </div>
            <div class="storage-card">
                <div class="storage-title"><span>Kho Tài Liệu 2</span><span id="st-text-2">Đang kết nối...</span></div>
                <div class="progress-bg"><div id="st-bar-2" class="progress-bar"></div></div>
            </div>
        </div>

        <!-- KHU VỰC TẢI LÊN VÀ XÓA -->
        <div class="action-grid">
            <!-- Form Tải Lên -->
            <div class="card-box">
                <h3 style="color: var(--primary);">📤 Tải File Lên Kho</h3>
                <form id="uploadForm">
                    <div class="form-group">
                        <label>Chọn Tệp (Có thể chọn nhiều tệp):</label>
                        <input type="file" id="fileInput" multiple required>
                    </div>
                    <div class="form-group">
                        <label>Chọn Kho Lưu Trữ:</label>
                        <select id="uploadTarget">
                            <option value="1">Kho Tài Liệu 1</option>
                            <option value="2">Kho Tài Liệu 2</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-upload" id="uploadBtn">Bắt Đầu Tải Lên</button>
                </form>
                <div id="uploadStatus" class="status-msg"></div>
            </div>

            <!-- Form Xóa File -->
            <div class="card-box">
                <h3 style="color: var(--danger);">🗑️ Xóa File Trực Tiếp</h3>
                <form id="deleteForm">
                    <div class="form-group">
                        <label>Dán File ID cần xóa:</label>
                        <input type="text" id="deleteFileId" placeholder="Ví dụ: 1a2b3c4d5e..." required>
                    </div>
                    <div class="form-group">
                        <label>Chọn Kho Chứa File:</label>
                        <select id="deleteTarget">
                            <option value="1">Kho Tài Liệu 1</option>
                            <option value="2">Kho Tài Liệu 2</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-delete" id="deleteBtn">Xóa File</button>
                </form>
                <div id="deleteStatus" class="status-msg"></div>
            </div>
        </div>

        <!-- KHUNG XEM TÀI LIỆU -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('storage1', this)">📁 Kho Tài Liệu 1</button>
            <button class="tab-btn" onclick="switchTab('storage2', this)">📁 Kho Tài Liệu 2</button>
        </div>

        <div class="embed-container" id="storage1">
            <iframe id="iframe1" src="https://drive.google.com/embeddedfolderview?id=1HLmBmIOrkJlqayUJJR8K_FV6EpETwhhH#grid"></iframe>
        </div>

        <div class="embed-container" id="storage2" style="display: none;">
            <iframe id="iframe2" src="https://drive.google.com/embeddedfolderview?id=1Nh3NKS8T6DmgsULwXHcsNCZp6AZcc55F#grid"></iframe>
        </div>
    </div>

    <script>
        // CẬP NHẬT 2 URL MỚI CỦA BẠN VÀO ĐÂY:
        const URL_1 = "https://script.google.com/macros/s/AKfycbwJ-v-X21uRdVXE6CcQkUtWuIJ5eDv5NarHwyqidRVPOkmizA1CqIPCqVO0mLFTgYQD/exec";
        const URL_2 = "https://script.google.com/macros/s/AKfycbz-n19c5rHMsDIukktWHCkEqOzwQqcTm7brmDwJIet-7m9oY4S3AU5E5IlP7ZCNdRFg/exec";

        // Tải thông tin dung lượng
        function loadStorageInfo(url, textId, barId) {
            fetch(url)
                .then(res => res.json())
                .then(data => {
                    if(data.status === 'success') {
                        document.getElementById(textId).innerText = `${data.usedGB}/${data.totalGB} GB (Trống ${data.freeGB} GB)`;
                        const bar = document.getElementById(barId);
                        bar.style.width = data.usedPercent + '%';
                        if(data.usedPercent > 85) bar.style.background = '#dc2626';
                    }
                })
                .catch(() => { document.getElementById(textId).innerText = "Lỗi kết nối"; });
        }

        function refreshStorage() {
            loadStorageInfo(URL_1, 'st-text-1', 'st-bar-1');
            loadStorageInfo(URL_2, 'st-text-2', 'st-bar-2');
        }

        // Chuyển Tab
        function switchTab(tabId, btn) {
            document.querySelectorAll('.embed-container').forEach(el => el.style.display = 'none');
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).style.display = 'block';
            btn.classList.add('active');
        }

        // Đọc File mã hóa Base64
        function readFileAsBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (evt) => resolve(evt.target.result);
                reader.onerror = (error) => reject(error);
                reader.readAsDataURL(file);
            });
        }

        // XỬ LÝ UPLOAD FILE HÀNG LOẠT (ĐÃ CHỈNH SỬA AN TOÀN DATA)
        document.getElementById('uploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const files = document.getElementById('fileInput').files;
            const target = document.getElementById('uploadTarget').value;
            const statusDiv = document.getElementById('uploadStatus');
            const btn = document.getElementById('uploadBtn');

            if (files.length === 0) return;
            const targetUrl = (target === '1') ? URL_1 : URL_2;

            btn.disabled = true;
            let success = 0, fail = 0;

            for (let i = 0; i < files.length; i++) {
                statusDiv.style.color = '#2563eb';
                statusDiv.innerText = `⏳ Đang tải (${i + 1}/${files.length}): ${files[i].name}...`;

                try {
                    const base64Data = await readFileAsBase64(files[i]);
                    const payload = {
                        action: "upload",
                        file: {
                            name: files[i].name || "Untitled",
                            type: files[i].type || "application/octet-stream",
                            base64: base64Data
                        }
                    };

                    const res = await fetch(targetUrl, {
                        method: 'POST',
                        body: JSON.stringify(payload)
                    });
                    const data = await res.json();
                    if (data.status === 'success') success++; else fail++;
                } catch (err) { fail++; }
            }

            btn.disabled = false;
            statusDiv.style.color = (fail === 0) ? '#16a34a' : '#dc2626';
            statusDiv.innerText = (fail === 0) ? `🎉 Đã tải lên thành công ${success} tệp!` : `Tải xong: ${success} thành công, ${fail} thất bại.`;

            document.getElementById('uploadForm').reset();
            refreshStorage();
            document.getElementById(`iframe${target}`).src += ''; // Refresh khung xem
        });

        // XỬ LÝ XÓA FILE TRỰC TIẾP (ĐÃ CHỈNH SỬA KHÔNG ĐỂ SỰ CỐ UNDEFINED TYPE)
        document.getElementById('deleteForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const fileId = document.getElementById('deleteFileId').value.trim();
            const target = document.getElementById('deleteTarget').value;
            const statusDiv = document.getElementById('deleteStatus');
            const btn = document.getElementById('deleteBtn');

            if (!confirm("Bạn chắc chắn muốn xóa file này khỏi hệ thống?")) return;

            const targetUrl = (target === '1') ? URL_1 : URL_2;
            btn.disabled = true;
            statusDiv.style.color = '#2563eb';
            statusDiv.innerText = '⏳ Đang tiến hành xóa file...';

            try {
                const payload = {
                    action: "delete",
                    fileId: fileId
                };

                const res = await fetch(targetUrl, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (data.status === 'success') {
                    statusDiv.style.color = '#16a34a';
                    statusDiv.innerText = '✅ ' + data.message;
                    document.getElementById('deleteFileId').value = '';
                    refreshStorage();
                    document.getElementById(`iframe${target}`).src += ''; // Refresh khung xem
                } else {
                    statusDiv.style.color = '#dc2626';
                    statusDiv.innerText = '❌ Lỗi: ' + data.message;
                }
            } catch (err) {
                statusDiv.style.color = '#dc2626';
                statusDiv.innerText = '❌ Xóa thất bại. Kiểm tra lại File ID!';
            }
            btn.disabled = false;
        });

        // Tải dữ liệu dung lượng ban đầu
        refreshStorage();
    </script>
</body>
</html>
