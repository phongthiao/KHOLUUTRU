<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hệ Thống Lưu Trữ Đám Mây Cá Nhân Pro</title>
  
  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Thư viện GramJS chạy trực tiếp trên Browser (Cho phép Upload file tới 2GB) -->
  <script src="https://cdn.jsdelivr.net/npm/telegram@2.26.11/browser/gramjs.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f5ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased selection:bg-indigo-500 selection:text-white">

  <!-- APP CONTAINER -->
  <div id="app" class="min-h-screen flex flex-col">

    <!-- 1. MÀN HÌNH ĐĂNG NHẬP HỆ THỐNG -->
    <div id="loginSection" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/90 backdrop-blur-md p-4">
      <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl w-full max-w-md shadow-2xl relative overflow-hidden">
        <div class="absolute -top-12 -right-12 w-32 h-32 bg-indigo-500/10 rounded-full blur-2xl"></div>
        <div class="text-center mb-8">
          <div class="inline-flex p-3 rounded-2xl bg-indigo-600/10 text-indigo-400 mb-3">
            <i data-lucide="cloud-lock" class="w-8 h-8"></i>
          </div>
          <h1 class="text-2xl font-bold text-slate-100">Đăng Nhập Khai Thác</h1>
          <p class="text-xs text-slate-400 mt-1">Nhập thông tin truy cập kho lưu trữ riêng</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">MÃ THIẾT BỊ (MTB)</label>
            <input type="text" id="inputMTB" required placeholder="Ví dụ: KH001" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500 transition text-slate-200 uppercase" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">MẬT KHẨU</label>
            <input type="password" id="inputPass" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500 transition text-slate-200" />
          </div>
          
          <div id="loginError" class="text-rose-400 text-xs hidden text-center bg-rose-500/10 py-2 rounded-lg border border-rose-500/20"></div>

          <button type="submit" id="btnLogin" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl transition flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/20">
            <span>Xác Nhận Đăng Nhập</span>
            <i data-lucide="arrow-right" class="w-4 h-4"></i>
          </button>
        </form>
      </div>
    </div>

    <!-- 2. GIAO DIỆN CHÍNH -->
    <div id="mainSection" class="hidden flex-col flex-1">
      
      <!-- HEADER / THANH ĐIỀU HƯỚNG -->
      <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="p-2 bg-indigo-600/20 text-indigo-400 rounded-xl">
              <i data-lucide="hard-drive" class="w-6 h-6"></i>
            </div>
            <div>
              <h2 class="text-sm font-bold text-slate-100">Cloud Storage Pro</h2>
              <p class="text-[10px] text-slate-400">Khách Hàng: <span id="displayMTB" class="text-indigo-400 font-semibold"></span></p>
            </div>
          </div>

          <!-- THANH TÍNH NĂNG ĐIỀU HƯỚNG BỔ SUNG -->
          <div class="flex items-center gap-2">
            <!-- NÚT TÍNH NĂNG MỚI: TẢI FILE SIÊU NẶNG (GRAMJS) -->
            <button onclick="openGramJSModal()" class="flex items-center gap-2 text-xs font-semibold bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white px-3 py-2 rounded-xl transition shadow-lg shadow-emerald-600/20 border border-emerald-500/30">
              <i data-lucide="zap" class="w-4 h-4 fill-white"></i>
              <span class="hidden sm:inline">Siêu Upload (>100MB)</span>
            </button>

            <!-- LỊCH SỬ SAO LƯỢNG -->
            <button onclick="openBackupHistoryModal()" class="flex items-center gap-2 text-xs font-semibold bg-slate-800 hover:bg-slate-700 px-3 py-2 rounded-xl transition text-indigo-300 border border-slate-700">
              <i data-lucide="history" class="w-4 h-4"></i>
              <span class="hidden sm:inline">Bản Cập Nhật</span>
            </button>

            <button onclick="handleLogout()" class="p-2 text-slate-400 hover:text-rose-400 hover:bg-rose-500/10 rounded-xl transition" title="Đăng Xuất">
              <i data-lucide="log-out" class="w-5 h-5"></i>
            </button>
          </div>
        </div>
      </header>

      <!-- BODY CONTENT -->
      <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6 flex-1 w-full flex flex-col gap-6">

        <!-- THANH CÔNG CỤ & DUNG LƯỢNG -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div class="md:col-span-2 bg-slate-900 border border-slate-800 p-4 rounded-2xl flex flex-col justify-between gap-4">
            <nav id="breadcrumb" class="flex items-center gap-2 text-xs text-slate-400 overflow-x-auto py-1"></nav>
            
            <div class="flex flex-wrap items-center gap-2">
              <label class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-4 py-2.5 rounded-xl transition cursor-pointer flex items-center gap-2 shadow-lg shadow-indigo-600/20">
                <i data-lucide="upload-cloud" class="w-4 h-4"></i>
                <span>Tải File Thường (&le;50MB)</span>
                <input type="file" id="fileInput" multiple class="hidden" onchange="uploadFiles(this.files)" />
              </label>

              <button onclick="createNewFolder()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold px-4 py-2.5 rounded-xl transition flex items-center gap-2 border border-slate-700">
                <i data-lucide="folder-plus" class="w-4 h-4 text-amber-400"></i>
                <span>Thư Mục Mới</span>
              </button>
            </div>
          </div>

          <!-- DUNG LƯỢNG KHO -->
          <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex flex-col justify-between">
            <div class="flex justify-between items-center text-xs">
              <span class="text-slate-400">Tổng Số Tệp</span>
              <span id="fileCountText" class="font-bold text-slate-200">0 tệp</span>
            </div>
            <div class="w-full bg-slate-950 h-2 rounded-full overflow-hidden my-2 border border-slate-800">
              <div id="storageBar" class="bg-indigo-500 h-full w-0 transition-all duration-300"></div>
            </div>
            <div class="flex justify-between items-center text-[11px] text-slate-400">
              <span>Đã lưu trữ</span>
              <span id="storageUsageText" class="text-indigo-400 font-semibold">0 MB</span>
            </div>
          </div>
        </div>

        <!-- TIẾN TRÌNH UPLOAD TỆP THƯỜNG -->
        <div id="uploadProgressContainer" class="hidden bg-slate-900 border border-slate-800 p-4 rounded-2xl">
          <div class="flex items-center justify-between text-xs mb-2">
            <span id="uploadStatusText" class="text-indigo-400 font-semibold flex items-center gap-2">
              <i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Đang tải lên dữ liệu...
            </span>
            <span id="uploadPercentText" class="text-slate-300 font-bold">0%</span>
          </div>
          <div class="w-full bg-slate-950 h-2 rounded-full overflow-hidden border border-slate-800">
            <div id="uploadProgressBar" class="bg-indigo-500 h-full w-0 transition-all"></div>
          </div>
        </div>

        <!-- DANH SÁCH FILE VÀ THƯ MỤC -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl flex-1 p-4 flex flex-col">
          <div id="fileListGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3"></div>
          <div id="emptyListState" class="hidden flex-col items-center justify-center py-16 text-slate-500">
            <i data-lucide="folder-open" class="w-12 h-12 stroke-1 mb-2 opacity-50"></i>
            <p class="text-xs">Thư mục trống</p>
          </div>
        </div>

      </main>
    </div>

    <!-- 3. MODAL TÍNH NĂNG MỚI: SIÊU UPLOAD FILE LỚN (GRAMJS MTPROTO 2GB) -->
    <div id="gramjsModal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-slate-950/80 backdrop-blur-sm p-4">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-xl overflow-hidden shadow-2xl flex flex-col">
        <div class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-900/50">
          <div class="flex items-center gap-2 text-emerald-400">
            <i data-lucide="zap" class="w-5 h-5 fill-emerald-400/20"></i>
            <h3 class="text-sm font-bold text-slate-100">Siêu Upload File Lớn (Tối đa 2 GB)</h3>
          </div>
          <button onclick="closeGramJSModal()" class="text-slate-400 hover:text-slate-100">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>

        <div class="p-6 space-y-6">
          <!-- KHU VỰC ĐĂNG NHẬP GRAMJS (Nếu chưa xác thực) -->
          <div id="gramjsAuthSection" class="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-3">
            <div class="text-xs font-semibold text-emerald-400 flex items-center gap-1.5">
              <i data-lucide="shield-check" class="w-4 h-4"></i> Xác thực Telegram MTProto Cá Nhân
            </div>
            
            <!-- BƯỚC 1: SỐ ĐIỆN THOẠI -->
            <div id="gStepPhone" class="flex gap-2">
              <input type="text" id="gInputPhone" placeholder="+84912345678" class="flex-1 bg-slate-900 border border-slate-700 text-xs px-3 py-2 rounded-lg outline-none focus:border-emerald-500 font-mono" />
              <button onclick="gSendCode()" id="gBtnSendCode" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold px-3 py-2 rounded-lg transition">Gửi OTP</button>
            </div>

            <!-- BƯỚC 2: OTP & 2FA -->
            <div id="gStepOTP" class="hidden space-y-2">
              <input type="text" id="gInputOTP" placeholder="Mã OTP..." class="w-full bg-slate-900 border border-slate-700 text-xs px-3 py-2 rounded-lg outline-none focus:border-emerald-500 font-mono" />
              <input type="password" id="gInput2FA" placeholder="Mật khẩu 2FA (nếu có)..." class="w-full bg-slate-900 border border-slate-700 text-xs px-3 py-2 rounded-lg outline-none" />
              <button onclick="gLoginOTP()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold py-2 rounded-lg transition">Xác Nhận Đăng Nhập</button>
            </div>

            <div id="gAuthStatus" class="text-[11px] text-amber-400 font-medium"></div>
          </div>

          <!-- KHU VỰC TẢI FILE LỚN (Chỉ mở khi đã login GramJS) -->
          <div id="gramjsUploadSection" class="opacity-50 pointer-events-none space-y-4">
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-2">Chọn file dung lượng lớn (100MB - 2GB):</label>
              <input type="file" id="gFileInput" class="block w-full text-xs text-slate-400 file:mr-3 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-emerald-600 file:text-white hover:file:bg-emerald-500 bg-slate-950 rounded-xl border border-slate-800 p-1 cursor-pointer" />
            </div>

            <button onclick="gUploadBigFile()" id="gBtnUpload" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-xl transition shadow-lg flex items-center justify-center gap-2">
              <i data-lucide="upload" class="w-4 h-4"></i>
              <span>Bắt Đầu Tải Lên Đám Mây</span>
            </button>

            <!-- Tiến trình Chunk Upload -->
            <div id="gProgressWidget" class="hidden bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-1.5">
              <div class="flex justify-between text-[11px] text-slate-300">
                <span id="gStatusText" class="truncate max-w-[300px]">Đang cắt nhỏ dữ liệu...</span>
                <span id="gPercentText" class="font-bold text-emerald-400">0%</span>
              </div>
              <div class="w-full bg-slate-900 h-2 rounded-full overflow-hidden border border-slate-800">
                <div id="gProgressBar" class="bg-emerald-500 h-full w-0 transition-all duration-150"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- MODAL PREVIEW FILE -->
    <div id="previewModal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-slate-950/90 backdrop-blur-md p-4">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-4xl h-[85vh] flex flex-col overflow-hidden">
        <div class="p-3 border-b border-slate-800 flex justify-between items-center">
          <span id="previewTitle" class="text-xs font-semibold text-slate-200 truncate pr-4"></span>
          <div class="flex items-center gap-2">
            <a id="previewDownloadBtn" href="#" target="_blank" download class="p-2 text-indigo-400 hover:bg-slate-800 rounded-xl transition" title="Tải về">
              <i data-lucide="download" class="w-4 h-4"></i>
            </a>
            <button onclick="closePreviewModal()" class="p-2 text-slate-400 hover:text-slate-100">
              <i data-lucide="x" class="w-5 h-5"></i>
            </button>
          </div>
        </div>
        <div id="previewContent" class="flex-1 bg-slate-950 flex items-center justify-center overflow-auto p-4"></div>
      </div>
    </div>

    <!-- MODAL LỊCH SỬ SAO LƯU SHEET -->
    <div id="backupModal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-slate-950/80 backdrop-blur-sm p-4">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-lg overflow-hidden shadow-2xl flex flex-col max-h-[80vh]">
        <div class="p-4 border-b border-slate-800 flex justify-between items-center">
          <div class="flex items-center gap-2 text-indigo-400">
            <i data-lucide="cloud-download" class="w-5 h-5"></i>
            <h3 class="text-sm font-bold text-slate-100">Bản Sao Lưu Trên Đám Mây</h3>
          </div>
          <button onclick="closeBackupModal()" class="text-slate-400 hover:text-slate-100">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>
        <div id="backupListContainer" class="p-4 overflow-y-auto space-y-2 flex-1"></div>
      </div>
    </div>

  </div>

  <!-- SCRIPT LOGIC TOÀN BỘ HỆ THỐNG -->
  <script>
    // ==========================================
    // ⚙️ CẤU HÌNH CỐ ĐỊNH SYSTEM & GRAMJS
    // ==========================================
    const AUTH_SHEET_URL = 'THAY_BANG_URL_GOOGLE_SHEET_QUAN_LY_TAI_KHOAN';
    const BACKUP_SCRIPT_URL = 'THAY_BANG_URL_APPS_SCRIPT_SAO_LUU';

    // Cấu hình GramJS chính thức của bạn
    const GRAMJS_API_ID = 37106540; 
    const GRAMJS_API_HASH = "db90fe26fe664946cb8d2427d9f15339"; 

    const { TelegramClient } = window.gramjs || window.telegram || {};
    const { StringSession } = (window.gramjs || window.telegram || {}).sessions || {};

    let CURRENT_USER = null;
    let CURRENT_MTB = '';
    let currentFolderId = 'root';
    let dbFiles = [];
    let breadcrumbStack = [{ id: 'root', name: 'Kho Lưu Trữ' }];

    // Quản lý Instance GramJS
    let gramClient = null;
    let gPhoneCodeHash = null;
    let gPhoneNumber = null;

    lucide.createIcons();

    // Tự động kiểm tra Đăng nhập
    window.addEventListener('DOMContentLoaded', () => {
      const savedUser = localStorage.getItem('CLOUD_USER_DATA');
      if (savedUser) {
        CURRENT_USER = JSON.parse(savedUser);
        CURRENT_MTB = CURRENT_USER.mtb;
        bootApplication();
      }
    });

    // ==========================================
    // 🔑 1. DỊCH VỤ XÁC THỰC MULTI-USER
    // ==========================================
    async function handleLogin(e) {
      e.preventDefault();
      const mtbInput = document.getElementById('inputMTB').value.trim().toUpperCase();
      const passInput = document.getElementById('inputPass').value.trim();
      const errBox = document.getElementById('loginError');
      const btn = document.getElementById('btnLogin');

      errBox.classList.add('hidden');
      btn.disabled = true;

      try {
        const res = await fetch(`${AUTH_SHEET_URL}?action=login&mtb=${encodeURIComponent(mtbInput)}&pass=${encodeURIComponent(passInput)}`);
        const data = await res.json();

        if (data && data.success) {
          CURRENT_USER = { mtb: data.mtb, token: data.token, chatId: data.chatId };
          CURRENT_MTB = data.mtb;
          localStorage.setItem('CLOUD_USER_DATA', JSON.stringify(CURRENT_USER));
          bootApplication();
        } else {
          errBox.innerText = data.message || 'Thiết bị hoặc Mật khẩu không đúng!';
          errBox.classList.remove('hidden');
        }
      } catch (err) {
        errBox.innerText = 'Lỗi kết nối máy chủ xác thực!';
        errBox.classList.remove('hidden');
      } finally {
        btn.disabled = false;
      }
    }

    function bootApplication() {
      document.getElementById('loginSection').classList.add('hidden');
      document.getElementById('mainSection').classList.remove('hidden');
      document.getElementById('mainSection').classList.add('flex');
      document.getElementById('displayMTB').innerText = CURRENT_MTB;
      autoFetchLatestBackupOnStart();
    }

    function handleLogout() {
      localStorage.removeItem('CLOUD_USER_DATA');
      localStorage.removeItem('gramjs_session');
      location.reload();
    }

    // ==========================================
    // ⚡ 2. MODULE TÍNH NĂNG MỚI: GRAMJS SIÊU UPLOAD (>100MB)
    // ==========================================
    function openGramJSModal() {
      document.getElementById('gramjsModal').classList.remove('hidden');
      checkGramJSSession();
    }

    function closeGramJSModal() {
      document.getElementById('gramjsModal').classList.add('hidden');
    }

    async function checkGramJSSession() {
      const savedSession = localStorage.getItem('gramjs_session');
      const authStatus = document.getElementById('gAuthStatus');
      const uploadSec = document.getElementById('gramjsUploadSection');

      if (savedSession) {
        authStatus.innerText = "⏳ Đang kết nối GramJS MTProto...";
        try {
          gramClient = new TelegramClient(new StringSession(savedSession), GRAMJS_API_ID, GRAMJS_API_HASH, { connectionRetries: 3 });
          await gramClient.connect();

          const me = await gramClient.getMe();
          if (me) {
            authStatus.innerText = `✅ Đã kết nối: ${me.firstName || ''} (${me.phone})`;
            uploadSec.classList.remove('opacity-50', 'pointer-events-none');
            document.getElementById('gramjsAuthSection').classList.add('hidden');
          }
        } catch (e) {
          authStatus.innerText = "⚠️ Phiên GramJS hết hạn, vui lòng OTP lại.";
          localStorage.removeItem('gramjs_session');
        }
      } else {
        authStatus.innerText = "Vui lòng nhập SĐT để cấp quyền upload file lớn.";
      }
    }

    async function gSendCode() {
      gPhoneNumber = document.getElementById('gInputPhone').value.trim();
      const status = document.getElementById('gAuthStatus');
      if (!gPhoneNumber) return alert('Chưa nhập SĐT!');

      status.innerText = "⏳ Đang gửi OTP về Telegram...";
      try {
        gramClient = new TelegramClient(new StringSession(""), GRAMJS_API_ID, GRAMJS_API_HASH, { connectionRetries: 3 });
        await gramClient.connect();

        const res = await gramClient.sendCode({ apiId: GRAMJS_API_ID, apiHash: GRAMJS_API_HASH }, gPhoneNumber);
        gPhoneCodeHash = res.phoneCodeHash;

        document.getElementById('gStepPhone').classList.add('hidden');
        document.getElementById('gStepOTP').classList.remove('hidden');
        status.innerText = "✅ Đã gửi mã OTP. Hãy kiểm tra Telegram!";
      } catch (err) {
        status.innerText = "❌ Lỗi: " + err.message;
      }
    }

    async function gLoginOTP() {
      const code = document.getElementById('gInputOTP').value.trim();
      const pass2FA = document.getElementById('gInput2FA').value.trim();
      const status = document.getElementById('gAuthStatus');

      status.innerText = "⏳ Đang xác thực...";
      try {
        await gramClient.signIn({
          phoneNumber: gPhoneNumber,
          phoneCodeHash: gPhoneCodeHash,
          phoneCode: async () => code,
          password: async () => pass2FA,
        });

        localStorage.setItem('gramjs_session', gramClient.session.save());
        const me = await gramClient.getMe();
        status.innerText = `✅ Đã kết nối: ${me.firstName}`;
        document.getElementById('gramjsAuthSection').classList.add('hidden');
        document.getElementById('gramjsUploadSection').classList.remove('opacity-50', 'pointer-events-none');
      } catch (err) {
        status.innerText = "❌ Lỗi OTP/2FA: " + err.message;
      }
    }

    async function gUploadBigFile() {
      const file = document.getElementById('gFileInput').files[0];
      if (!file) return alert('Chưa chọn tệp!');

      const progressWidget = document.getElementById('gProgressWidget');
      const progressBar = document.getElementById('gProgressBar');
      const percentText = document.getElementById('gPercentText');
      const statusText = document.getElementById('gStatusText');
      const btn = document.getElementById('gBtnUpload');

      progressWidget.classList.remove('hidden');
      btn.disabled = true;

      try {
        statusText.innerText = "⏳ Đang cắt nhỏ tệp và upload...";
        
        // Tải lên Telegram qua cơ chế Chunking của GramJS
        const uploadedFile = await gramClient.uploadFile({
          file: file,
          workers: 3,
          onProgress: (p) => {
            const pct = Math.round(p * 100);
            progressBar.style.width = pct + '%';
            percentText.innerText = pct + '%';
          }
        });

        statusText.innerText = "⏳ Đang tạo thông tin tệp...";
        const msg = await gramClient.sendFile("me", {
          file: uploadedFile,
          caption: `📂 File: ${file.name}\n💾 Dung lượng: ${formatBytes(file.size)}`
        });

        // Tạo File Object đưa vào hệ thống quản lý giao diện
        const fileObj = {
          id: 'file_' + Date.now(),
          parentId: currentFolderId,
          name: file.name,
          size: file.size,
          type: 'file',
          mimeType: file.type || 'application/octet-stream',
          fileId: msg.media.document.id.toString(), // GramJS File Document ID
          createdAt: new Date().toLocaleDateString('vi-VN')
        };

        dbFiles.push(fileObj);
        renderFiles();
        updateStorageUsage();
        autoExportBackupToCloud();

        alert('🎉 Upload file lớn thành công!');
        closeGramJSModal();
      } catch (err) {
        alert('❌ Lỗi upload file lớn: ' + err.message);
      } finally {
        btn.disabled = false;
        progressWidget.classList.add('hidden');
      }
    }

    // ==========================================
    // ☁️ 3. ĐỒNG BỘ VỚI SHEETS VÀ CÁC THAO TÁC FILE CHUẨN
    // ==========================================
    async function autoExportBackupToCloud() {
      if (!CURRENT_MTB) return;
      try {
        await fetch(BACKUP_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            mtb: CURRENT_MTB,
            time: new Date().toLocaleString('vi-VN'),
            backupData: JSON.stringify(dbFiles)
          })
        });
      } catch (err) { console.error(err); }
    }

    async function autoFetchLatestBackupOnStart() {
      try {
        const res = await fetch(`${BACKUP_SCRIPT_URL}?mtb=${CURRENT_MTB}&t=${Date.now()}`);
        const listData = await res.json();
        if (listData && listData.length > 0) {
          const latestItem = listData[listData.length - 1];
          const fullJsonData = (latestItem.mainData || "") + (latestItem.subData || "");
          if (fullJsonData) dbFiles = JSON.parse(fullJsonData);
        }
      } catch (e) { console.log(e); } 
      finally {
        renderBreadcrumb();
        renderFiles();
        updateStorageUsage();
      }
    }

    async function uploadFiles(files) {
      if (!files || files.length === 0) return;
      const progressContainer = document.getElementById('uploadProgressContainer');
      const progressBar = document.getElementById('uploadProgressBar');
      const percentText = document.getElementById('uploadPercentText');
      progressContainer.classList.remove('hidden');

      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        if (file.size > 50 * 1024 * 1024) {
          alert(`File ${file.name} lớn hơn 50MB. Vui lòng chọn nút "Siêu Upload" ở trên menu!`);
          continue;
        }

        const formData = new FormData();
        formData.append('chat_id', CURRENT_USER.chatId);
        formData.append('document', file);

        await new Promise((resolve) => {
          const xhr = new XMLHttpRequest();
          xhr.open('POST', `https://api.telegram.org/bot${CURRENT_USER.token}/sendDocument`);
          xhr.upload.onprogress = (e) => {
            if (e.lengthComputable) {
              const percent = Math.round((e.loaded / e.total) * 100);
              progressBar.style.width = `${percent}%`;
              percentText.innerText = `${percent}% (${i + 1}/${files.length})`;
            }
          };
          xhr.onload = () => {
            if (xhr.status === 200) {
              const res = JSON.parse(xhr.responseText);
              if (res.ok) {
                const doc = res.result.document;
                dbFiles.push({
                  id: 'file_' + Date.now(),
                  parentId: currentFolderId,
                  name: file.name,
                  size: file.size,
                  type: 'file',
                  mimeType: file.type,
                  fileId: doc.file_id,
                  createdAt: new Date().toLocaleDateString('vi-VN')
                });
              }
            }
            resolve();
          };
          xhr.onerror = () => resolve();
          xhr.send(formData);
        });
      }

      progressContainer.classList.add('hidden');
      renderFiles();
      updateStorageUsage();
      autoExportBackupToCloud();
    }

    function createNewFolder() {
      const folderName = prompt('Tên thư mục mới:');
      if (!folderName || !folderName.trim()) return;
      dbFiles.push({
        id: 'folder_' + Date.now(),
        parentId: currentFolderId,
        name: folderName.trim(),
        type: 'folder',
        createdAt: new Date().toLocaleDateString('vi-VN')
      });
      renderFiles();
      autoExportBackupToCloud();
    }

    function renderFiles() {
      const grid = document.getElementById('fileListGrid');
      const emptyState = document.getElementById('emptyListState');
      grid.innerHTML = '';

      const currentItems = dbFiles.filter(item => item.parentId === currentFolderId);
      if (currentItems.length === 0) {
        emptyState.classList.remove('hidden');
        emptyState.classList.add('flex');
      } else {
        emptyState.classList.add('hidden');
        emptyState.classList.remove('flex');

        currentItems.forEach(item => {
          const card = document.createElement('div');
          card.className = 'bg-slate-950 border border-slate-800 hover:border-indigo-500/50 p-3 rounded-xl transition group flex flex-col justify-between relative';

          if (item.type === 'folder') {
            card.innerHTML = `
              <div onclick="enterFolder('${item.id}', '${item.name}')" class="cursor-pointer">
                <div class="flex items-center gap-2 text-amber-400 mb-2">
                  <i data-lucide="folder" class="w-6 h-6 fill-amber-400/10"></i>
                  <span class="text-xs font-semibold text-slate-200 truncate">${item.name}</span>
                </div>
                <div class="text-[10px] text-slate-500">${item.createdAt}</div>
              </div>
              <button onclick="deleteItem('${item.id}')" class="absolute top-2 right-2 text-slate-600 hover:text-rose-400 opacity-0 group-hover:opacity-100 transition p-1">
                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
              </button>
            `;
          } else {
            card.innerHTML = `
              <div onclick="previewFile('${item.id}')" class="cursor-pointer">
                <div class="flex items-center gap-2 text-indigo-400 mb-2">
                  <i data-lucide="${getFileIcon(item.mimeType)}" class="w-6 h-6"></i>
                  <span class="text-xs font-semibold text-slate-200 truncate">${item.name}</span>
                </div>
                <div class="text-[10px] text-slate-500">${formatBytes(item.size)}</div>
              </div>
              <button onclick="deleteItem('${item.id}')" class="absolute top-2 right-2 text-slate-600 hover:text-rose-400 opacity-0 group-hover:opacity-100 transition p-1">
                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
              </button>
            `;
          }
          grid.appendChild(card);
        });
      }
      lucide.createIcons();
    }

    function enterFolder(id, name) {
      currentFolderId = id;
      breadcrumbStack.push({ id, name });
      renderBreadcrumb();
      renderFiles();
    }

    function navigateToBreadcrumb(index) {
      breadcrumbStack = breadcrumbStack.slice(0, index + 1);
      currentFolderId = breadcrumbStack[breadcrumbStack.length - 1].id;
      renderBreadcrumb();
      renderFiles();
    }

    function renderBreadcrumb() {
      const nav = document.getElementById('breadcrumb');
      nav.innerHTML = '';
      breadcrumbStack.forEach((item, index) => {
        const isLast = index === breadcrumbStack.length - 1;
        const btn = document.createElement('button');
        btn.className = `flex items-center gap-1 ${isLast ? 'text-indigo-400 font-bold' : 'hover:text-slate-200'}`;
        btn.innerText = item.name;
        btn.onclick = () => navigateToBreadcrumb(index);
        nav.appendChild(btn);
        if (!isLast) {
          const sep = document.createElement('span');
          sep.className = 'text-slate-600';
          sep.innerText = '/';
          nav.appendChild(sep);
        }
      });
    }

    function deleteItem(id) {
      if (!confirm('Xóa tệp/thư mục này?')) return;
      dbFiles = dbFiles.filter(item => item.id !== id && item.parentId !== id);
      renderFiles();
      updateStorageUsage();
      autoExportBackupToCloud();
    }

    async function previewFile(fileId) {
      const file = dbFiles.find(f => f.id === fileId);
      if (!file) return;

      const modal = document.getElementById('previewModal');
      const title = document.getElementById('previewTitle');
      const content = document.getElementById('previewContent');
      const downloadBtn = document.getElementById('previewDownloadBtn');

      title.innerText = file.name;
      content.innerHTML = `<div class="text-xs text-indigo-400">⏳ Đang lấy link xem trực tiếp...</div>`;
      modal.classList.remove('hidden');

      try {
        const res = await fetch(`https://api.telegram.org/bot${CURRENT_USER.token}/getFile?file_id=${file.fileId}`);
        const data = await res.json();

        if (data.ok) {
          const downloadUrl = `https://api.telegram.org/file/bot${CURRENT_USER.token}/${data.result.file_path}`;
          downloadBtn.href = downloadUrl;

          if (file.mimeType.startsWith('image/')) {
            content.innerHTML = `<img src="${downloadUrl}" class="max-h-full max-w-full rounded-lg object-contain" />`;
          } else if (file.mimeType.startsWith('video/')) {
            content.innerHTML = `<video src="${downloadUrl}" controls class="max-h-full max-w-full rounded-lg"></video>`;
          } else {
            content.innerHTML = `<div class="text-center text-slate-400 text-xs">Không hỗ trợ xem nhanh.<br><a href="${downloadUrl}" target="_blank" class="text-indigo-400 underline mt-2 inline-block">Nhấn vào đây để tải xuống</a></div>`;
          }
        } else {
          content.innerHTML = `<div class="text-xs text-amber-400">Tệp này có thể vượt quá 20MB hoặc upload bằng GramJS.<br>Vui lòng mở ứng dụng Telegram để xem/tải về!</div>`;
        }
      } catch (err) {
        content.innerHTML = `<div class="text-xs text-rose-400">Lỗi kết nối tệp xem trước!</div>`;
      }
    }

    function closePreviewModal() {
      document.getElementById('previewModal').classList.add('hidden');
    }

    async function openBackupHistoryModal() {
      const modal = document.getElementById('backupModal');
      const container = document.getElementById('backupListContainer');
      modal.classList.remove('hidden');
      container.innerHTML = `<div class="text-center py-6 text-indigo-400 text-xs">⏳ Đang đọc danh sách bản lưu...</div>`;

      try {
        const res = await fetch(`${BACKUP_SCRIPT_URL}?mtb=${CURRENT_MTB}&t=${Date.now()}`);
        const listData = await res.json();
        if (!listData || listData.length === 0) {
          container.innerHTML = `<div class="text-center py-6 text-slate-500 text-xs">Chưa có bản sao lưu nào.</div>`;
          return;
        }

        let html = '';
        for (let i = listData.length - 1; i >= 0; i--) {
          const item = listData[i];
          const fullJsonData = (item.mainData || "") + (item.subData || "");
          html += `
            <div class="bg-slate-950 border border-slate-800 p-3 rounded-xl flex items-center justify-between hover:border-indigo-500/50 transition">
              <div>
                <div class="text-xs font-bold text-slate-200">🕒 ${item.time}</div>
                <div class="text-[10px] text-slate-400 mt-0.5">Mã thiết bị: ${CURRENT_MTB}</div>
              </div>
              <button onclick="applyBackupFromCloud('${encodeURIComponent(fullJsonData)}')" class="bg-indigo-600/20 text-indigo-300 border border-indigo-500/30 text-xs px-3 py-1.5 rounded-lg font-semibold transition">
                📥 Khôi Phục
              </button>
            </div>
          `;
        }
        container.innerHTML = html;
      } catch (err) {
        container.innerHTML = `<div class="text-center py-6 text-rose-400 text-xs">Lỗi kết nối bản lưu!</div>`;
      }
    }

    function applyBackupFromCloud(encodedData) {
      dbFiles = JSON.parse(decodeURIComponent(encodedData));
      renderFiles();
      updateStorageUsage();
      closeBackupModal();
    }

    function closeBackupModal() {
      document.getElementById('backupModal').classList.add('hidden');
    }

    function updateStorageUsage() {
      const totalBytes = dbFiles.reduce((acc, curr) => acc + (curr.size || 0), 0);
      document.getElementById('storageUsageText').innerText = formatBytes(totalBytes);
      document.getElementById('fileCountText').innerText = `${dbFiles.filter(i => i.type === 'file').length} tệp`;
      const percent = Math.min(100, (totalBytes / (10 * 1024 * 1024 * 1024)) * 100);
      document.getElementById('storageBar').style.width = `${percent}%`;
    }

    function formatBytes(bytes, decimals = 2) {
      if (!bytes) return '0 Bytes';
      const k = 1024, dm = decimals < 0 ? 0 : decimals;
      const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
    }

    function getFileIcon(mimeType) {
      if (!mimeType) return 'file-text';
      if (mimeType.startsWith('image/')) return 'file-image';
      if (mimeType.startsWith('video/')) return 'file-video';
      if (mimeType.startsWith('audio/')) return 'file-audio';
      return 'file';
    }
  </script>
