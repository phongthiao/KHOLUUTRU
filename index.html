<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản Lý Đa Kho OneDrive Multi-Store</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; margin: 20px; background: #f0f2f5; color: #333; }
    .container { max-width: 1100px; margin: 0 auto; }
    .accounts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 15px; margin-bottom: 20px; }
    .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .progress-bar { height: 12px; background: #e0e0e0; border-radius: 6px; overflow: hidden; margin: 10px 0; }
    .progress-fill { height: 100%; background: #0078d4; width: 0%; transition: width 0.3s; }
    .btn { background: #0078d4; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 500; margin-right: 5px; }
    .btn:hover { background: #005a9e; }
    .btn-success { background: #107c41; }
    .btn-danger { background: #d13438; }
    input[type="text"], input[type="file"] { padding: 8px; margin: 5px 0; border: 1px solid #ccc; border-radius: 6px; width: 100%; box-sizing: border-box; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; background: white; border-radius: 8px; overflow: hidden; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
    th { background: #f8f9fa; }
    .status-text { font-size: 0.9em; color: #0078d4; font-weight: bold; margin-top: 10px; }
    .code-box { background: #fff3cd; border: 1px solid #ffeeba; padding: 10px; border-radius: 6px; margin-top: 10px; word-break: break-all; }
  </style>
</head>
<body>
  <div class="container">
    <h2>📁 Hệ Thống Quản Lý Đa Kho OneDrive</h2>
    
    <div class="accounts-grid" id="accountsList"></div>

    <div class="card">
      <h3 id="currentKhoTitle">🔍 Đang chọn: Chưa mở kho nào</h3>
      <input type="text" id="searchInput" placeholder="Tìm kiếm tệp trong kho..." oninput="filterFiles()">
      
      <div style="margin-top: 15px;">
        <label><b>Tải tệp lên kho đang chọn:</b></label>
        <input type="file" id="fileUploader" multiple>
        <button class="btn btn-success" onclick="uploadFiles()">🚀 Tải Lên</button>
        <button class="btn" onclick="downloadSelectedBatch()">📦 Tải Hàng Loạt (.ZIP)</button>
      </div>
      <div id="statusMessage" class="status-text"></div>
    </div>

    <table>
      <thead>
        <tr>
          <th width="40"><input type="checkbox" id="selectAll" onclick="toggleSelectAll(this)"></th>
          <th>Tên Tệp / Thư Mục</th>
          <th>Dung Lượng</th>
          <th>Thao Tác</th>
        </tr>
      </thead>
      <tbody id="fileListBody">
        <tr><td colspan="4" style="text-align: center;">Vui lòng kết nối kho bên trên.</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    const CLIENT_ID = "9e5f94bc-e8a4-4e73-b8be-63364c29d753";
    let activeIndex = null;
    let currentFiles = [];

    async function init() {
      renderAccounts();
    }

    async function loginDeviceCode(index) {
      const card = document.getElementById(`card-${index}`);
      card.innerHTML = `<h4>Kho ${index + 1}: Đang tạo mã kết nối...</h4>`;

      try {
        const res = await fetch("https://login.microsoftonline.com/common/oauth2/v2.0/devicecode", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: new URLSearchParams({
            client_id: CLIENT_ID,
            scope: "offline_access Files.ReadWrite.All User.Read"
          })
        });
        const data = await res.json();

        if (data.user_code) {
          card.innerHTML = `
            <h4>Kho ${index + 1}: Xác minh đăng nhập</h4>
            <div class="code-box">
              <p>1. Mở link: <a href="${data.verification_uri}" target="_blank"><b>${data.verification_uri}</b></a></p>
              <p>2. Nhập mã này: <b style="color:red; font-size:1.2em;">${data.user_code}</b></p>
              <p><i>Đang chờ bạn nhập mã...</i></p>
            </div>
          `;

          pollToken(data.device_code, data.interval || 5, index);
        } else {
          alert("Không tạo được mã xác minh. Hãy thử lại!");
          renderAccounts();
        }
      } catch (err) {
        alert("Lỗi kết nối: " + err.message);
        renderAccounts();
      }
    }

    async function pollToken(deviceCode, interval, index) {
      const timer = setInterval(async () => {
        const res = await fetch("https://login.microsoftonline.com/common/oauth2/v2.0/token", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: new URLSearchParams({
            grant_type: "urn:ietf:params:oauth:grant-type:device_code",
            client_id: CLIENT_ID,
            device_code: deviceCode
          })
        });
        const data = await res.json();

        if (data.access_token) {
          clearInterval(timer);
          localStorage.setItem(`onedrive_access_token_${index}`, data.access_token);
          if (data.refresh_token) {
            localStorage.setItem(`onedrive_refresh_token_${index}`, data.refresh_token);
          }
          renderAccounts();
        } else if (data.error && data.error !== "authorization_pending") {
          clearInterval(timer);
          alert("Quá thời gian xác nhận hoặc xảy ra lỗi. Vui lòng bấm thử lại!");
          renderAccounts();
        }
      }, interval * 1000);
    }

    async function getValidToken(index) {
      let accessToken = localStorage.getItem(`onedrive_access_token_${index}`);
      const refreshToken = localStorage.getItem(`onedrive_refresh_token_${index}`);

      if (!accessToken && !refreshToken) return null;

      // Kiểm tra token còn sống không
      const checkRes = await fetch("https://graph.microsoft.com/v1.0/me/drive", {
        headers: { Authorization: `Bearer ${accessToken}` }
      });

      if (checkRes.ok) return accessToken;

      // Nếu hết hạn, dùng Refresh Token để đổi Access Token mới ngầm
      if (refreshToken) {
        const res = await fetch("https://login.microsoftonline.com/common/oauth2/v2.0/token", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: new URLSearchParams({
            grant_type: "refresh_token",
            client_id: CLIENT_ID,
            refresh_token: refreshToken
          })
        });
        const data = await res.json();
        if (data.access_token) {
          localStorage.setItem(`onedrive_access_token_${index}`, data.access_token);
          if (data.refresh_token) localStorage.setItem(`onedrive_refresh_token_${index}`, data.refresh_token);
          return data.access_token;
        }
      }
      return null;
    }

    async function renderAccounts() {
      const container = document.getElementById("accountsList");
      container.innerHTML = "";

      for (let i = 0; i < 3; i++) {
        const card = document.createElement("div");
        card.className = "card";
        card.id = `card-${i}`;

        const token = await getValidToken(i);

        if (token) {
          const driveInfo = await fetchDriveQuota(token);
          const usedGB = (driveInfo.used / (1024 ** 3)).toFixed(2);
          const totalGB = (driveInfo.total / (1024 ** 3)).toFixed(2);
          const percent = ((driveInfo.used / driveInfo.total) * 100).toFixed(1);

          card.innerHTML = `
            <h4>Kho ${i + 1}: (Đã kết nối)</h4>
            <p>Đã dùng: <b>${usedGB} GB</b> / ${totalGB} GB (${percent}%)</p>
            <div class="progress-bar"><div class="progress-fill" style="width: ${percent}%"></div></div>
            <button class="btn" onclick="loadFiles(${i})">📂 Mở Kho Này</button>
            <button class="btn btn-danger" onclick="logoutAccount(${i})">Thoát Kho</button>
          `;
        } else {
          card.innerHTML = `
            <h4>Kho ${i + 1}: (Chưa kết nối)</h4>
            <p>Liên kết Hotmail ${i + 1}</p>
            <button class="btn" onclick="loginDeviceCode(${i})">+ Kết Nối Hotmail</button>
          `;
        }
        container.appendChild(card);
      }

      for (let i = 0; i < 3; i++) {
        if (localStorage.getItem(`onedrive_access_token_${i}`) && activeIndex === null) {
          loadFiles(i);
          break;
        }
      }
    }

    async function fetchDriveQuota(token) {
      try {
        const res = await fetch("https://graph.microsoft.com/v1.0/me/drive", {
          headers: { Authorization: `Bearer ${token}` }
        });
        const data = await res.json();
        return data.quota || { used: 0, total: 5368709120 };
      } catch {
        return { used: 0, total: 5368709120 };
      }
    }

    async function loadFiles(index) {
      activeIndex = index;
      const token = await getValidToken(index);
      document.getElementById("currentKhoTitle").innerText = `🔍 Đang xem: Kho ${index + 1}`;
      
      const res = await fetch("https://graph.microsoft.com/v1.0/me/drive/root/children", {
        headers: { Authorization: `Bearer ${token}` }
      });
      const data = await res.json();
      currentFiles = data.value || [];
      renderFileList(currentFiles);
    }

    function renderFileList(files) {
      const tbody = document.getElementById("fileListBody");
      tbody.innerHTML = "";

      if (!files || files.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align: center;">Kho này chưa có tệp nào.</td></tr>';
        return;
      }

      files.forEach((file, idx) => {
        const sizeMB = (file.size / (1024 * 1024)).toFixed(2);
        const downloadUrl = file["@microsoft.graph.downloadUrl"];

        tbody.innerHTML += `
          <tr>
            <td><input type="checkbox" class="file-select" data-index="${idx}"></td>
            <td>${file.folder ? "📁" : "📄"} <b>${file.name}</b></td>
            <td>${file.folder ? "-" : sizeMB + " MB"}</td>
            <td>
              ${file.file ? `<a href="${downloadUrl}" target="_blank" class="btn">Tải Về</a>` : ""}
            </td>
          </tr>
        `;
      });
    }

    async function uploadFiles() {
      if (activeIndex === null) return alert("Vui lòng mở 1 kho trước!");
      const fileInput = document.getElementById("fileUploader");
      if (!fileInput.files.length) return alert("Chưa chọn tệp!");

      const token = await getValidToken(activeIndex);
      const status = document.getElementById("statusMessage");

      for (let file of fileInput.files) {
        status.innerText = `⏳ Đang tải lên: ${file.name}...`;
        await fetch(`https://graph.microsoft.com/v1.0/me/drive/root:/${file.name}:/content`, {
          method: "PUT",
          headers: { Authorization: `Bearer ${token}`, "Content-Type": file.type },
          body: file
        });
      }
      status.innerText = "✅ Tải lên hoàn tất!";
      fileInput.value = "";
      loadFiles(activeIndex);
      renderAccounts();
    }

    async function downloadSelectedBatch() {
      const checkboxes = document.querySelectorAll(".file-select:checked");
      if (!checkboxes.length) return alert("Chưa chọn tệp!");

      const zip = new JSZip();
      const status = document.getElementById("statusMessage");
      status.innerText = "⏳ Đang chuẩn bị tải về...";

      for (let cb of checkboxes) {
        const fileData = currentFiles[cb.getAttribute("data-index")];
        if (fileData.file) {
          const downloadUrl = fileData["@microsoft.graph.downloadUrl"];
          const blob = await fetch(downloadUrl).then(r => r.blob());
          zip.file(fileData.name, blob);
        }
      }

      const content = await zip.generateAsync({ type: "blob" });
      saveAs(content, `OneDrive_Kho_${activeIndex + 1}.zip`);
      status.innerText = "✅ Đã tải file ZIP thành công!";
    }

    function toggleSelectAll(masterKey) {
      document.querySelectorAll(".file-select").forEach(cb => cb.checked = masterKey.checked);
    }

    function filterFiles() {
      const query = document.getElementById("searchInput").value.toLowerCase();
      renderFileList(currentFiles.filter(f => f.name.toLowerCase().includes(query)));
    }

    function logoutAccount(index) {
      localStorage.removeItem(`onedrive_access_token_${index}`);
      localStorage.removeItem(`onedrive_refresh_token_${index}`);
      renderAccounts();
    }

    init();
  </script>
</body>
</html>
