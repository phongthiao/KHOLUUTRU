<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartSun Edu - Azota System</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #090d16;
      --bg-card: #0f172a;
      --border-color: rgba(255, 255, 255, 0.08);
      --border-glow: rgba(99, 102, 241, 0.3);
      --primary: #6366f1;
      --primary-glow: rgba(99, 102, 241, 0.4);
      --cyan: #06b6d4;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --radius-lg: 18px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    
    body { 
      background-color: var(--bg-dark); 
      color: var(--text-main); 
      min-height: 100vh;
    }

    /* MÀN HÌNH KHÓA TRUY CẬP ĐĂNG NHẬP / ĐĂNG KÝ */
    #auth-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(9, 13, 22, 0.96);
      backdrop-filter: blur(12px);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-box {
      background: var(--bg-card);
      border: 1px solid var(--border-glow);
      padding: 32px;
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 420px;
      box-shadow: 0 0 40px rgba(99, 102, 241, 0.2);
    }

    .auth-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }

    .auth-tab-btn {
      flex: 1;
      padding: 10px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-weight: 700;
      cursor: pointer;
      font-size: 0.95rem;
      border-radius: var(--radius-sm);
    }

    .auth-tab-btn.active {
      background: rgba(99, 102, 241, 0.2);
      color: #fff;
      border: 1px solid var(--primary);
    }

    .auth-form { display: none; }
    .auth-form.active { display: block; }

    label { display: block; margin-top: 12px; font-weight: 600; font-size: 0.82rem; color: var(--text-muted); text-transform: uppercase; }
    input { width: 100%; padding: 12px; margin-top: 6px; border: 1px solid var(--border-color); border-radius: var(--radius-md); background: rgba(0,0,0,0.3); color: #fff; }
    
    .btn {
      width: 100%; padding: 12px; border: none; border-radius: var(--radius-md); font-weight: 700; cursor: pointer; margin-top: 18px;
      background: linear-gradient(135deg, var(--primary) 0%, #4f46e5 100%); color: white;
    }

    header {
      background: rgba(15, 23, 42, 0.8);
      padding: 1rem 2rem;
      border-bottom: 1px solid var(--border-color);
      display: flex; justify-content: space-between; align-items: center;
    }

    .main-content { padding: 40px 20px; text-align: center; }
  </style>
</head>
<body>

  <!-- AUTH MODAL -->
  <div id="auth-overlay">
    <div class="auth-box">
      <h2 style="text-align: center; color: var(--cyan); margin-bottom: 6px;">AZOTA SYSTEM</h2>
      <p style="text-align: center; color: var(--text-muted); font-size: 0.85rem; margin-bottom: 20px;">Dùng thử 7 ngày hệ thống SmartSun Edu</p>

      <div class="auth-tabs">
        <button class="auth-tab-btn active" id="tab-login-btn" onclick="switchAuthTab('login')">Đăng Nhập</button>
        <button class="auth-tab-btn" id="tab-register-btn" onclick="switchAuthTab('register')">Đăng Kỳ (7 Ngày)</button>
      </div>

      <!-- FORM ĐĂNG NHẬP -->
      <form id="login-form" class="auth-form active" onsubmit="handleAuthSubmit(event, 'login')">
        <label>Gmail:</label>
        <input type="email" id="login-gmail" required placeholder="nhap@gmail.com">

        <label>Mật khẩu:</label>
        <input type="password" id="login-pass" required placeholder="••••••••">

        <button type="submit" id="btn-login" class="btn">🔓 Đăng Nhập</button>
      </form>

      <!-- FORM ĐĂNG KÝ -->
      <form id="register-form" class="auth-form" onsubmit="handleAuthSubmit(event, 'register')">
        <label>Gmail nhận tài khoản:</label>
        <input type="email" id="reg-gmail" required placeholder="nhap@gmail.com">

        <label>Khởi tạo Mật khẩu:</label>
        <input type="password" id="reg-pass" required placeholder="••••••••">

        <p style="font-size: 0.78rem; color: #f59e0b; margin-top: 10px; line-height: 1.4;">
          📌 Mật khẩu sẽ tự động gửi về Gmail của bạn. Tài khoản tự xóa khỏi Sheet sau 7 ngày.
        </p>

        <button type="submit" id="btn-register" class="btn" style="background: linear-gradient(135deg, #10b981 0%, #059669 100%);">📝 Đăng Ký Dùng Thử</button>
      </form>
    </div>
  </div>

  <!-- GIAO DIỆN CHÍNH SAU KHI ĐĂNG NHẬP THÀNH CÔNG -->
  <header>
    <div>
      <h1 style="font-size: 1.2rem; color: #fff;">SmartSun Edu - Azota</h1>
    </div>
    <div>
      <span id="user-display" style="font-size: 0.85rem; color: var(--cyan); margin-right: 12px;"></span>
      <button onclick="logout()" style="padding: 6px 12px; background: #f43f5e; border: none; color: white; border-radius: 6px; cursor: pointer;">Đăng xuất</button>
    </div>
  </header>

  <div class="main-content">
    <h2>🎉 Chúc mừng! Bạn đã xác thực tài khoản Azota thành công!</h2>
    <p style="color: var(--text-muted); margin-top: 10px;">Hệ thống đã kết nối trực tiếp với dữ liệu trên Google Sheets.</p>
  </div>

  <script>
    // URL GOOGLE APPS SCRIPT CỦA BẠN
    const AUTH_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxHss4s3tUdNWIO6xHKf75a-jROgoepwuaAnV6Ua6GDdIWtJ3eytDlzQD6Xl3kbnF3a/exec";

    function switchAuthTab(type) {
      document.querySelectorAll('.auth-tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));

      if (type === 'login') {
        document.getElementById('tab-login-btn').classList.add('active');
        document.getElementById('login-form').classList.add('active');
      } else {
        document.getElementById('tab-register-btn').classList.add('active');
        document.getElementById('register-form').classList.add('active');
      }
    }

    async function handleAuthSubmit(e, action) {
      e.preventDefault();

      const gmail = action === 'login' ? document.getElementById('login-gmail').value : document.getElementById('reg-gmail').value;
      const password = action === 'login' ? document.getElementById('login-pass').value : document.getElementById('reg-pass').value;
      const btn = action === 'login' ? document.getElementById('btn-login') : document.getElementById('btn-register');

      btn.disabled = true;
      btn.innerText = "Đang xử lý...";

      try {
        const response = await fetch(AUTH_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action, gmail, password })
        });

        const res = await response.json();

        if (res.success) {
          alert(res.message);
          if (action === 'login') {
            sessionStorage.setItem('azota_user', gmail);
            checkLoginState();
          } else {
            switchAuthTab('login');
            document.getElementById('login-gmail').value = gmail;
          }
        } else {
          alert("❌ " + res.message);
        }
      } catch (err) {
        alert("Lỗi kết nối tới Server Google Sheet!");
      } finally {
        btn.disabled = false;
        btn.innerText = action === 'login' ? "🔓 Đăng Nhập" : "📝 Đăng Ký Dùng Thử";
      }
    }

    function checkLoginState() {
      const user = sessionStorage.getItem('azota_user');
      const overlay = document.getElementById('auth-overlay');
      if (user) {
        overlay.style.display = 'none';
        document.getElementById('user-display').innerText = `👤 ${user}`;
      } else {
        overlay.style.display = 'flex';
      }
    }

    function logout() {
      sessionStorage.removeItem('azota_user');
      checkLoginState();
    }

    window.addEventListener('DOMContentLoaded', checkLoginState);
  </script>
</body>
</html>
